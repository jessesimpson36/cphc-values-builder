orchestration:
  enabled: true
  ingress:
    grpc:
      enabled: false
  clusterSize: '12'
  partitionCount: '35'
  replicationFactor: '3'
  pvcSize: 160Gi
  resources:
    requests:
      cpu: 8000m
      memory: 24Gi
    limits:
      cpu: 12000m
      memory: 36Gi
  pvcStorageClassName: premium-rwo
optimize:
  enabled: false
identity:
  enabled: false
identityPostgresql:
  enabled: false
webModeler:
  enabled: false
webModelerPostgresql:
  enabled: false
connectors:
  enabled: false
console:
  enabled: false
global:
  elasticsearch:
    enabled: true
    external: true
    auth:
      username: camunda
      secret:
        inlineSecret: es-secret
    url:
      protocol: https
      host: elasticsearch.example.internal
      port: 9200
    tls:
      enabled: true
  opensearch:
    enabled: false
  ingress:
    enabled: false
  gateway:
    enabled: false
elasticsearch:
  enabled: false
