orchestration:
  enabled: true
  ingress:
    grpc:
      enabled: false
  security:
    authentication:
      oidc:
        type: KEYCLOAK
        issuer: https://keycloak.example.com/realms/camunda
        clientId: orchestration
        audience: orchestration-api
        redirectUrl: https://camunda.example.com
        usernameClaim: preferred_username
        groupsClaim: groups
        secret:
          inlineSecret: oidc-secret
optimize:
  enabled: false
identity:
  enabled: false
identityPostgresql:
  enabled: false
webModeler:
  enabled: false
webModelerPostgresql:
  enabled: false
connectors:
  enabled: false
console:
  enabled: false
global:
  elasticsearch:
    enabled: true
    external: true
    auth:
      username: camunda
      secret:
        inlineSecret: es-secret
    url:
      protocol: https
      host: elasticsearch.example.internal
      port: 9200
    tls:
      enabled: true
  opensearch:
    enabled: false
  ingress:
    enabled: false
  security:
    authentication:
      method: oidc
elasticsearch:
  enabled: false
