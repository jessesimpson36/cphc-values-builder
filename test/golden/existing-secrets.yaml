orchestration:
  enabled: true
  ingress:
    grpc:
      enabled: false
optimize:
  enabled: false
identity:
  enabled: true
  externalDatabase:
    enabled: true
    host: identity-db.example.internal
    port: 5432
    username: identity
    secret:
      existingSecret: camunda-identity-db
      existingSecretKey: password
    database: identity
identityPostgresql:
  enabled: false
webModeler:
  enabled: false
webModelerPostgresql:
  enabled: false
connectors:
  enabled: false
console:
  enabled: false
global:
  elasticsearch:
    enabled: true
    external: true
    auth:
      username: camunda
      secret:
        existingSecret: camunda-elasticsearch
        existingSecretKey: password
    url:
      protocol: https
      host: elasticsearch.example.internal
      port: 9200
    tls:
      enabled: true
  opensearch:
    enabled: false
  ingress:
    enabled: false
  gateway:
    enabled: false
  license:
    secret:
      existingSecret: camunda-license
      existingSecretKey: license-key
elasticsearch:
  enabled: false
