orchestration:
  enabled: true
  ingress:
    grpc:
      enabled: false
  clusterSize: '6'
  partitionCount: '17'
  replicationFactor: '4'
  pvcSize: 77Gi
  resources:
    requests:
      cpu: 8000m
      memory: 24Gi
    limits:
      cpu: 12000m
      memory: 36Gi
  env:
    - name: CAMUNDA_CLUSTER_INITIALCONTACTPOINTS
      value: camunda-zeebe-0.camunda-zeebe.camunda-region-0.svc.cluster.local:26502,camunda-zeebe-1.camunda-zeebe.camunda-region-0.svc.cluster.local:26502,camunda-zeebe-2.camunda-zeebe.camunda-region-0.svc.cluster.local:26502,camunda-zeebe-0.camunda-zeebe.camunda-region-1.svc.cluster.local:26502,camunda-zeebe-1.camunda-zeebe.camunda-region-1.svc.cluster.local:26502,camunda-zeebe-2.camunda-zeebe.camunda-region-1.svc.cluster.local:26502
optimize:
  enabled: false
identity:
  enabled: false
identityPostgresql:
  enabled: false
webModeler:
  enabled: false
webModelerPostgresql:
  enabled: false
connectors:
  enabled: false
console:
  enabled: false
global:
  elasticsearch:
    enabled: true
    external: true
    auth:
      username: camunda
      secret:
        inlineSecret: es-secret
    url:
      protocol: https
      host: elasticsearch.example.internal
      port: 9200
    tls:
      enabled: true
  opensearch:
    enabled: false
  ingress:
    enabled: false
  gateway:
    enabled: false
  multiregion:
    regions: 2
    regionId: 1
elasticsearch:
  enabled: false
