orchestration:
  enabled: true
  ingress:
    grpc:
      enabled: false
  clusterSize: '8'
  partitionCount: '24'
  replicationFactor: '4'
  pvcSize: 128Gi
  pvcStorageClassName: premium-rwo
  resources:
    requests:
      cpu: 4000m
      memory: 8Gi
    limits:
      cpu: 6000m
      memory: 12Gi
optimize:
  enabled: false
identity:
  enabled: false
identityPostgresql:
  enabled: false
webModeler:
  enabled: false
webModelerPostgresql:
  enabled: false
connectors:
  enabled: false
console:
  enabled: false
global:
  elasticsearch:
    enabled: true
    external: true
    auth:
      username: camunda
      secret:
        inlineSecret: es-secret
    url:
      protocol: https
      host: elasticsearch.example.internal
      port: 9200
    tls:
      enabled: true
  opensearch:
    enabled: false
  ingress:
    enabled: false
elasticsearch:
  enabled: false
