name: Build cphc
run-name: ${{ github.actor }} Build CPHC Values

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The generated schemas are committed, so a stale one would silently pass
      # every other check. Regenerate and fail if anything differs.
      - name: Schemas are in sync with the vendored charts
        run: |
          npm run parse
          git diff --exit-code --stat src/schemas src/uiSchema.json \
            || { echo "::error::generated schemas are stale - run 'npm run parse' and commit the result"; exit 1; }

      - name: Validate Helm paths against the chart schema
        run: npm run validate

      - name: Unit tests and golden files
        run: npm test

      - run: npm run build

  # Renders every scenario against the published chart. This is what catches a
  # value the chart rejects outright - a renamed path, a number where the chart
  # schema wants a string, or a missing key another component requires. Unit
  # tests alone cannot see any of that.
  helm-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: azure/setup-helm@v5

      - run: npm ci

      # Builds the container image but deliberately never pushes it. No image is
  # published anywhere (issue #28) - this only proves the Dockerfile still
  # builds, so a dependency or build-script change cannot quietly break
  # self-hosting for the people who build it themselves.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t cphc-values-builder:ci .

      - name: It serves the app
        run: |
          docker run -d --name cphc -p 8080:8080 cphc-values-builder:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | grep -q 'Camunda Helm Values Generator'
          docker rm -f cphc

  # Renders every scenario against every supported Camunda release.
      - name: Render generated values against every supported chart
        run: npm run verify:helm
